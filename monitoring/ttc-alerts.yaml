apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: ttc-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: ttc-ingestion
      rules:

        - alert: TTCIngestionFailed
          expr: max(ttc_ingestion_last_run_success) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "TTC ingestion failed"
            description: "The most recent TTC ingestion run did not complete successfully."

        - alert: TTCIngestionStale
          expr: time() - max(ttc_ingestion_last_success_timestamp_seconds) > 86400
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "TTC ingestion is stale"
            description: "No successful TTC ingestion has completed in the last 24 hours."
