apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-nfs-pv
spec:
  capacity:
    storage: 5Gi

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: synology-nfs

  mountOptions:
    - hard
    - nfsvers=4.1

  nfs:
# Replace with the address of your NFS server.

    server: <NFS_SERVER_IP>

# Replace with the exported directory used for PostgreSQL data.      
    path: <NFS_EXPORT_PATH>

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-nfs
  namespace: ttc-monitor
spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: synology-nfs

  resources:
    requests:
      storage: 5Gi


