apiVersion: v1
kind: Service
metadata:
  name: ttc-api
  namespace: ttc-monitor
  labels:
    app: ttc-api
spec:
  type: ClusterIP
  selector:
    app: ttc-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttc-api
  namespace: ttc-monitor
spec:
  replicas: 2

  selector:
    matchLabels:
      app: ttc-api

  template:
    metadata:
      labels:
        app: ttc-api

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: api
          image: ghcr.io/jorge-ma/ttc-reliability-v2-api:0.1.4
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: POSTGRES_HOST
              value: postgres

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
