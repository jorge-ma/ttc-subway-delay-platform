apiVersion: batch/v1
kind: CronJob

metadata:
  name: ttc-ingestion
  namespace: ttc-monitor

spec:
  schedule: "0 6 * * *"
  timeZone: "America/Toronto"

  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1

      template:
        spec:
          restartPolicy: Never

          volumes:
            - name: tmp
              emptyDir: {}

          containers:
            - name: ingestion
              image: ghcr.io/jorge-ma/ttc-reliability-v2-api:0.1.5
              imagePullPolicy: IfNotPresent

              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

              volumeMounts:
                - name: tmp
                  mountPath: /tmp

              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"

              command:
                - python
                - -m
                - ingestion.run_ingestion

              env:
                - name: POSTGRES_HOST
                  value: postgres

                - name: POSTGRES_PORT
                  value: "5432"

                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_DB

                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_USER

                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD

