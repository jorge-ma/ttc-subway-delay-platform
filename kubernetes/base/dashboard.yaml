apiVersion: v1
kind: Service
metadata:
  name: ttc-dashboard
  namespace: ttc-monitor
spec:
  type: NodePort
  selector:
    app: ttc-dashboard
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30501

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttc-dashboard
  namespace: ttc-monitor
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ttc-dashboard

  template:
    metadata:
      labels:
        app: ttc-dashboard

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: dashboard
          image: ghcr.io/jorge-ma/ttc-reliability-v2-dashboard:0.1.1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8501

          env:
            - name: TTC_API_BASE_URL
              value: http://ttc-api:8000

          startupProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi


